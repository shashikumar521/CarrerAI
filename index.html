        <section style="margin-top: 1.5rem;">
          <h2 style="font-size: 1.25rem; margin-bottom: 0.75rem;">What is CareerAI?</h2>
          <p style="margin-bottom: 1rem; line-height: 1.6; color: #334155;">CareerAI is an all-in-one technical career companion for engineering students, uniting skill measurement, market demand matching, and personalized interview readiness into one unified platform:</p>
          <ul style="line-height: 1.7; padding-left: 1.25rem; color: #334155;">
            <li><strong>AI-Powered Career Guidance:</strong> Interactive mentorship and placement strategy powered by intelligent career advisors to help students make confident, informed career decisions.</li>
            <li><strong>Skill Tracking &amp; Progress:</strong> Continuous tracking of core programming languages, frameworks, and technical competencies with transparent milestones as coursework and projects advance.</li>
            <li><strong>Career Readiness:</strong> Objective placement readiness scoring evaluating resume ATS compliance, academics, and practical skill depth against real recruiter benchmarks.</li>
            <li><strong>Skill Gap Analysis:</strong> Automated gap detection comparing current abilities to target job roles like SDE, Full-Stack, AI/ML, and DevOps with actionable roadmaps.</li>
            <li><strong>Learning Recommendations:</strong> Curated course pathways, hands-on tutorials, and industry-recognized certifications mapped specifically to bridge each student's missing skills.</li>
            <li><strong>Job Recommendations:</strong> Personalized matching with verified engineering roles, internships, and recruiter opportunities tailored to the student's qualification profile.</li>
            <li><strong>Placement Eligibility:</strong> Automated eligibility screening across cutoffs, CGPA thresholds, and backlog criteria for 30+ top campus hiring companies and tech recruiters.</li>
          </ul>
        </section>

        <section style="margin-top: 1.5rem; padding: 1.25rem; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.75rem;">
          <h2 style="font-size: 1.15rem; margin-top: 0; margin-bottom: 0.5rem; color: #0f172a;">About CareerAI</h2>
          <p style="margin: 0 0 0.75rem 0; line-height: 1.6; color: #475569; font-size: 0.9rem;">CareerAI was created to solve the persistent disconnect between standard college curricula and the competitive requirements of modern software engineering recruitment. Rather than relying on guesswork, students use CareerAI to gain clear, diagnostic visibility into where they stand across technical, academic, and practical benchmarks.</p>
          <p style="margin: 0; line-height: 1.6; color: #475569; font-size: 0.9rem;">From the initial semester through campus placements and off-campus drives, CareerAI equips learners with the tools, practice drills, ATS resume compliance, and step-by-step guidance needed to turn career aspirations into realized offers.</p>
        </section>
