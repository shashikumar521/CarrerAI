          <p style="margin-bottom: 1rem; line-height: 1.6; color: #334155;">CarrerAi is an AI-powered career guidance and learning platform designed to help students and job seekers explore career opportunities, build professional resumes, develop skills, discover courses and plan their career journey. By uniting real-time skill measurement, market demand matching, and personalized interview readiness, CarrerAi empowers students to achieve their career goals with confidence.</p>

              <p style="margin: 0; line-height: 1.6; color: #475569; font-size: 0.9rem;">Interactive career counseling powered by intelligent guidance algorithms to answer career questions, analyze skill roadmaps, and recommend strategic next steps.</p>
            </article>

            <article style="padding: 1rem; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.5rem;">

              <p style="margin: 0; line-height: 1.6; color: #475569; font-size: 0.9rem;">Create single-column, ATS-compliant technical resumes with automated formatting verification, quantified impact suggestions, and instant PDF downloads.</p>
            </article>

            <article style="padding: 1rem; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.5rem;">

              <p style="margin: 0; line-height: 1.6; color: #475569; font-size: 0.9rem;">Real-time course progression tracking across modules, hands-on lessons, and milestone certifications to maintain steady skill development momentum.</p>

            <article style="padding: 1rem; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.5rem;">

          <p style="margin: 0 0 0.75rem 0; line-height: 1.6; color: #475569; font-size: 0.9rem;">CarrerAi was created to solve the persistent disconnect between standard college curricula and the competitive requirements of modern software engineering recruitment. Rather than relying on guesswork, students use CarrerAi to gain clear, diagnostic visibility into where they stand across technical, academic, and practical benchmarks.</p>
